[package]
name = "eea-desktop"
version = "1.3.1-dev.6"
description = "Embedded Engineering Agent desktop shell"
edition = "2021"

[lib]
name = "eea_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
